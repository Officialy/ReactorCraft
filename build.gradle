ext {
    mod_id          = "reactorcraft"
    mod_name        = "ReactorCraft"
    mod_group_id    = "reika.reactorcraft"
    mod_description = "ReactorCraft adds realistic nuclear fission, fusion and breeder reactors powered by RotaryCraft."
}

// Headless JUnit harness: NeoForge moddev loads the mod (and its registries) into the test
// JVM via the FML JUnit launcher, so registry/recipe/serializer/fluid integrity can be asserted
// without launching a client. Run with `gradlew :ReactorCraft:test`.
neoForge {
    unitTest {
        enable()
        testedMod = mods.named(project.mod_id).get()
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation project(":DragonAPI")
    implementation project(":RotaryCraft")
    implementation project(":ElectriCraft")

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

